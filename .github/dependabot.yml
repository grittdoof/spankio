version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Les versions sont pinnées : Dependabot doit mettre à jour package.json.
    versioning-strategy: increase
    groups:
      types:
        patterns: ['@types/*']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', 'jsdom', 'axe-core']
      lint:
        patterns: ['eslint', 'eslint-*', 'typescript-eslint', '@eslint/*', 'globals']
    labels: ['dependencies']
    # Majeures volontairement bloquées, chacune documentée comme risque
    # accepté dans CLAUDE.md. Sans ces exclusions, Dependabot rouvrirait
    # indéfiniment des PR qui ne peuvent pas passer la CI.
    ignore:
      # R6 : eslint-config-next@15 ne déclare pas ESLint 10.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # TypeScript 7 (portage natif) : hors stack validée.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Doit rester aligné sur la version de Node exécutée : 24.x, celle de
      # `.nvmrc` (CI) et du projet Vercel.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # jsdom >= 30 exige Node ^22.22.2 || ^24.15.0 || >=26. La CI (24.20) le
      # satisfait, mais pas le poste de développement actuel (22.17), et
      # `engine-strict` fait échouer l'installation. À lever quand le poste
      # sera aligné sur 24.
      - dependency-name: jsdom
        update-types: ['version-update:semver-major']
      # R7 : `postcss` est figé par un override tant que Next 15 est imposé.
      - dependency-name: postcss

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ['ci']
