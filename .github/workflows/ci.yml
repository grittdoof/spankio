name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Aucun job n'a besoin d'écrire dans le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs factices : la CI ne parle à aucun service réel.
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key

jobs:
  quality:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` échoue si le lockfile a dérivé du package.json : garde-fou
      # contre les dépendances non pinnées / non committées.
      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # unit + integration (API) + rls (isolation multi-tenant) + a11y (axe-core)
      - name: Tests
        run: npm run test

      - name: Build de production
        run: npm run build

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: npm audit (bloquant à partir de « high »)
        run: npm audit --audit-level=high

  secrets:
    name: Scan de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : gitleaks analyse aussi les commits passés.
          fetch-depth: 0
      # Binaire invoqué directement plutôt que l'action officielle : celle-ci
      # scanne la plage `<base>^..<head>`, qui n'existe pas quand la base est
      # le commit initial (le premier push casse donc systématiquement).
      # Ici on scanne TOUT l'historique, à chaque exécution.
      - name: Installer gitleaks (version et empreinte épinglées)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan de l'historique complet
        run: |
          set -euo pipefail
          /tmp/gitleaks git . --redact --exit-code 1 --log-opts=--all 2>&1 \
            | tee /tmp/gitleaks-git.log
          # Un scan qui n'a rien pu lire sort quand même en 0 : on refuse ce
          # faux succès en exigeant qu'au moins un commit ait été analysé.
          grep -qE '[1-9][0-9]* commits scanned' /tmp/gitleaks-git.log

      - name: Scan de l'arbre de travail
        run: /tmp/gitleaks dir . --redact --exit-code 1
